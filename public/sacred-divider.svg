<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60">
  <defs>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7850FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#C8AA6E" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#F2DBA5" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#C8AA6E" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7850FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 主横线 -->
  <line x1="0" y1="30" x2="1200" y2="30" stroke="url(#line-grad)" stroke-width="0.5"/>

  <!-- 中心菱形 -->
  <g fill="none" stroke="#C8AA6E" stroke-width="0.6" opacity="0.4" filter="url(#glow)">
    <polygon points="600,10 620,30 600,50 580,30"/>
    <polygon points="600,15 612,30 600,45 588,30" stroke-width="0.3" opacity="0.5"/>
  </g>

  <!-- 左右装饰点 -->
  <g fill="#C8AA6E" opacity="0.2">
    <circle cx="560" cy="30" r="1.5"/>
    <circle cx="640" cy="30" r="1.5"/>
    <circle cx="520" cy="30" r="1"/>
    <circle cx="680" cy="30" r="1"/>
    <circle cx="480" cy="30" r="0.8"/>
    <circle cx="720" cy="30" r="0.8"/>
  </g>

  <!-- 两侧小菱形 -->
  <g fill="none" stroke="#7850FF" stroke-width="0.4" opacity="0.2">
    <polygon points="500,22 508,30 500,38 492,30"/>
    <polygon points="700,22 708,30 700,38 692,30"/>
  </g>

  <!-- 极细装饰线 -->
  <g stroke="url(#line-grad)" stroke-width="0.3" opacity="0.15">
    <line x1="0" y1="20" x2="460" y2="20"/>
    <line x1="740" y1="20" x2="1200" y2="20"/>
    <line x1="0" y1="40" x2="460" y2="40"/>
    <line x1="740" y1="40" x2="1200" y2="40"/>
  </g>
</svg>
